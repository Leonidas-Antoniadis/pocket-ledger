# Builds an installable Android APK on GitHub's own runners (no Expo account, no Play Store)
# and publishes it as a GitHub Release.
#
# A new release is built automatically on every push to main that changes the app,
# on a pushed tag (git tag v1.0.1 && git push origin v1.0.1), or by hand from the Actions tab.
#
# Permanent download link (always the newest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/pocket-ledger.apk
#
# Signing: the APK is signed with the fixed key that ships with the Expo/React Native template,
# so every build installs over the previous one and the data on the phone is kept.
# That key is public, which is fine for a privately shared test app but not for a store release.

name: Android APK

on:
  push:
    branches: [main, claude/android-apk-release]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    name: Build and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Set version code
        # Android only installs an update over the old app when the version code goes up.
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER) + 1;
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2) + "\n");
            console.log("version", cfg.expo.version, "code", cfg.expo.android.versionCode);
          '

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Collect APK
        id: apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pocket-ledger.apk
          ls -lh pocket-ledger.apk
          VERSION=$(node -p 'require("./app.json").expo.version')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-apk
          path: mobile/pocket-ledger.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pocket Ledger ${{ steps.apk.outputs.tag }}
          make_latest: true
          files: mobile/pocket-ledger.apk
          body: |
            Pocket Ledger ${{ steps.apk.outputs.version }} (build ${{ github.run_number }}) for Android.

            **Install or update:** open this link on the phone, download `pocket-ledger.apk` and tap it.
            Allow "install unknown apps" for the browser if Android asks. If Play Protect warns about an
            unknown developer, choose "Install anyway". Updating keeps all entries and receipt photos.

            Always-latest link: https://github.com/${{ github.repository }}/releases/latest/download/pocket-ledger.apk
